name: GitHub Pages

on:
  push:
    branches: [main, github-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # upload-pages-artifact excludes dotfiles, including the required /.rsc.
      - name: Package static site including homepage navigation payload
        run: tar --dereference --hard-dereference --directory dist/client -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    # Before the repository rename, pushes only build and test the new site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'HqSelene/HqSelene.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
