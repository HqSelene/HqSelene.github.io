  background: var(--blue);

  font-family: 'Josefin Sans', sans-serif;

}

  max-width: 100%;

  display: block;

<!-- ─────────────────────────────────────────
     SCRIPTS
───────────────────────────────────────── -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  /* ── 1. Image fade-in on scroll ── */
  const imgs = document.querySelectorAll(".project-content img");
  const imgObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add("visible");
      else e.target.classList.remove("visible");
    });
  }, { threshold: 0.15 });
  imgs.forEach(img => imgObserver.observe(img));

  /* ── 2. Build TOC ── */
  const content   = document.querySelector('.project-content');
  const tocContent = document.querySelector('.toc-content');
  if (content && tocContent) {
    const headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
    headings.forEach((h, i) => {
      const id = `heading-${i}`;
      h.id = id;
      const a = document.createElement('a');
      a.href = `#${id}`;
      a.textContent = h.textContent;
      a.className = `toc-level-${h.tagName.toLowerCase()}`;
      tocContent.appendChild(a);
    });

    // smooth scroll
    tocContent.addEventListener('click', e => {
      if (e.target.tagName === 'A') {
        e.preventDefault();
        document.getElementById(e.target.getAttribute('href').slice(1))
          ?.scrollIntoView({ behavior: 'smooth' });
      }
    });

    // active highlight
    const tocLinks = tocContent.querySelectorAll('a');
    const headingEls = content.querySelectorAll('h1,h2,h3,h4,h5,h6');
    const tocHighlight = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          tocLinks.forEach(l => l.classList.remove('toc-active'));
          const active = tocContent.querySelector(`a[href="#${e.target.id}"]`);
          if (active) active.classList.add('toc-active');
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });
    headingEls.forEach(h => tocHighlight.observe(h));
  }

  /* ── 3. Image lightbox ── */
  const viewer    = document.querySelector('.image-viewer');
  const viewerImg = viewer.querySelector('img');
  const closeBtn  = viewer.querySelector('.close-button');
  let current = 0;
  const allImgs = Array.from(document.querySelectorAll('.project-content img'));

  const prevBtn = Object.assign(document.createElement('div'), { className: 'nav-btn prev-btn', innerHTML: '❮' });
  const nextBtn = Object.assign(document.createElement('div'), { className: 'nav-btn next-btn', innerHTML: '❯' });
  viewer.append(prevBtn, nextBtn);

  function showImg(idx) {
    current = idx;
    viewerImg.src = allImgs[idx].src;
    prevBtn.style.display = idx === 0 ? 'none' : 'block';
    nextBtn.style.display = idx === allImgs.length - 1 ? 'none' : 'block';
  }

  function openViewer(idx) {
    showImg(idx);
    viewer.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeViewer() {
    viewer.classList.remove('active');
    document.body.style.overflow = '';
  }

  allImgs.forEach((img, i) => img.addEventListener('click', () => openViewer(i)));
  prevBtn.addEventListener('click', e => { e.stopPropagation(); if (current > 0) showImg(current - 1); });
  nextBtn.addEventListener('click', e => { e.stopPropagation(); if (current < allImgs.length - 1) showImg(current + 1); });
  [viewer, closeBtn].forEach(el => el.addEventListener('click', e => { if (e.target === el) closeViewer(); }));

  document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('active')) return;
    if (e.key === 'ArrowLeft'  && current > 0)               showImg(current - 1);
    if (e.key === 'ArrowRight' && current < allImgs.length-1) showImg(current + 1);
    if (e.key === 'Escape') closeViewer();
  });

});
</script>
